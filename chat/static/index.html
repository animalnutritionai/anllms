<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>anllms -- Dairy Nutrition Assistant</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  #chat { border: 1px solid #ccc; border-radius: 8px; height: 60vh; overflow-y: auto; padding: 1rem; margin-bottom: 1rem; }
  .msg { margin-bottom: 0.9rem; white-space: pre-wrap; }
  .user { color: #1a4; font-weight: 600; }
  .assistant { color: #222; }
  .assistant .label { font-weight: 600; color: #555; }
  #inputRow { display: flex; gap: 0.5rem; }
  #messageInput { flex: 1; padding: 0.6rem; font-size: 1rem; }
  button { padding: 0.6rem 1.2rem; font-size: 1rem; }
  #status { color: #888; font-size: 0.85rem; margin-top: 0.4rem; }
</style>
</head>
<body>
  <h1>Dairy Nutrition Assistant (lactating cows only)</h1>
  <p style="color:#666; font-size:0.9rem;">
    Built on the NASEM (2021) model. Every number this assistant gives you
    is backed by a real equation -- ask "why" and it will show its work.
  </p>
  <div id="chat"></div>
  <div id="inputRow">
    <input id="messageInput" type="text" placeholder="Ask about a lactating cow's requirements..." autofocus>
    <button id="sendBtn">Send</button>
  </div>
  <div id="status"></div>

<script>
let history = [];

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('messageInput');
const statusEl = document.getElementById('status');
const sendBtn = document.getElementById('sendBtn');

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = (role === 'user' ? '<span class="user">You:</span> ' : '<span class="label">Assistant:</span> ') + text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage('user', text);
  inputEl.value = '';
  sendBtn.disabled = true;
  statusEl.textContent = 'Thinking...';

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history })
    });
    const data = await resp.json();
    if (data.error) {
      addMessage('assistant', 'Error: ' + data.error);
    } else {
      addMessage('assistant', data.reply);
      history = data.history;
    }
  } catch (e) {
    addMessage('assistant', 'Error contacting server: ' + e);
  } finally {
    statusEl.textContent = '';
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
