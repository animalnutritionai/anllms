<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- width=device-width + initial-scale=1 fixes the Safari focus-zoom bug.
     Deliberately NOT using maximum-scale=1 / user-scalable=no -- those
     "fix" the same bug by disabling pinch-zoom entirely, which harms
     low-vision users. This fixes the actual cause instead. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anllms -- Dairy Nutrition Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
  :root {
    /* Deliberately a shade darker than pure CSS "forestgreen" (#228B22) --
       that lighter shade only gets ~4.4:1 contrast with white text, just
       under the 4.5:1 AA minimum. This shade gets white text to ~7.9:1. */
    --bg: #1B5E20;
    --text: #FFFFFF;
    --text-muted: #C8C8C8;
    --heading: #FFD700;
    --subheading: #FFFFFF;
    --link: #D1C4E9;
    --border: #2E7D32;
  }
  * { box-sizing: border-box; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
    max-width: 700px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1, h2 { color: var(--heading); }
  h3 { color: var(--subheading); }
  a { color: var(--link); }
  p { color: var(--text); }
  .muted { color: var(--text-muted); }

  .skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    background-color: var(--heading);
    color: var(--bg);
    padding: 0.6rem 1rem;
    border-radius: 0 0 4px 0;
    font-weight: 600;
    z-index: 20;
  }
  .skip-link:focus {
    left: 0;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  header { position: relative; }

  #newConversationBtn {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 10;
    background-color: var(--heading);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    padding: 0.5rem 0.9rem;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  #newConversationBtn:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 2px;
  }

  #chat {
    border: 1px solid var(--border);
    border-radius: 8px;
    max-height: 65vh;
    overflow-y: auto;
    padding: 1rem;
    margin-bottom: 1rem;
    background-color: rgba(0, 0, 0, 0.15);
  }

  section.exchange {
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
    margin-bottom: 1rem;
  }
  section.exchange:last-child {
    border-bottom: none;
    margin-bottom: 0;
  }
  .exchange h2 { font-size: 1.3rem; margin: 0.8rem 0 0.3rem; }
  .exchange h3 { font-size: 1.15rem; margin: 0.6rem 0 0.3rem; }
  .exchange > p.prompt-text { margin: 0 0 0.5rem; white-space: pre-wrap; }
  .response-body { margin: 0 0 0.5rem; }
  .response-body p:first-child { margin-top: 0; }
  .response-body p:last-child { margin-bottom: 0; }

  .actions { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
  .actions button {
    background-color: rgba(255, 255, 255, 0.08);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.3rem 0.7rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .actions button:hover { background-color: rgba(255, 255, 255, 0.18); }
  .actions button:focus-visible { outline: 2px solid var(--heading); outline-offset: 2px; }
  .actions button:disabled { opacity: 0.5; cursor: default; }

  #composer { margin-top: 0.5rem; }
  #inputRow { display: flex; gap: 0.5rem; }
  #messageInput {
    flex: 1;
    padding: 0.6rem;
    font-size: 16px; /* must stay >= 16px to avoid Safari's focus-zoom */
    background-color: #FFFFFF;
    color: #111111;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  #sendBtn {
    padding: 0.6rem 1.2rem;
    font-size: 1rem;
    background-color: var(--heading);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.6; cursor: default; }
  #sendBtn:focus-visible, #messageInput:focus-visible {
    outline: 2px solid var(--heading);
    outline-offset: 2px;
  }
  #status { font-size: 0.85rem; margin-top: 0.4rem; }
</style>
</head>
<body>
  <a href="#messageInput" class="skip-link">Skip to message composer</a>

  <header>
    <h1>Dairy Nutrition Assistant (lactating cows only)</h1>
    <p class="muted" style="font-size:0.9rem;">
      Built on the NASEM (2021) model. Every number this assistant gives you
      is backed by a real equation -- ask "why" and it will show its work.
    </p>
    <button id="newConversationBtn" type="button">New Conversation</button>
  </header>

  <main aria-label="Conversation">
    <div id="chat" role="log" aria-live="polite" aria-relevant="additions"></div>
  </main>

  <form id="composer" aria-label="Send a message">
    <label for="messageInput" class="visually-hidden">Message</label>
    <div id="inputRow">
      <input id="messageInput" type="text" placeholder="Ask about a lactating cow's requirements..." autofocus>
      <button id="sendBtn" type="submit">Send</button>
    </div>
    <div id="status" class="muted" role="status" aria-live="polite"></div>
  </form>

<script>
const STORAGE_KEY = 'anllms_conversation_v1';

let history = [];        // conversation context sent to the backend API
let exchanges = [];      // {prompt, response, historyLengthBefore} per exchange
let exchangeCount = 0;
let latestSection = null; // the one <section> that currently holds Retry
let latestN = 0;

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('messageInput');
const statusEl = document.getElementById('status');
const composerEl = document.getElementById('composer');
const sendBtn = document.getElementById('sendBtn');
const newConversationBtn = document.getElementById('newConversationBtn');

function renderMarkdown(text) {
  let html;
  if (window.marked && window.DOMPurify) {
    const raw = marked.parse(text);
    html = DOMPurify.sanitize(raw);
  } else {
    const escaped = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    html = `<p>${escaped.replace(/\n/g, '<br>')}</p>`;
  }
  return html.replace(/>\s+</g, '><');
}

function makeCopyButton(getText, ariaLabel) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Copy';
  btn.setAttribute('aria-label', ariaLabel);
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(getText());
      const original = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = original; }, 1500);
    } catch (e) {
      btn.textContent = 'Copy failed';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
    }
  });
  return btn;
}

function makePlaceholderButton(label, id) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = label;
  btn.id = id;
  btn.addEventListener('click', () => {
    console.log(`${label} clicked (placeholder, no action wired up yet)`);
  });
  return btn;
}

function setBusy(isBusy) {
  sendBtn.disabled = isBusy;
  if (latestSection) {
    const retryBtn = latestSection.querySelector('.retry-btn');
    if (retryBtn) retryBtn.disabled = isBusy;
  }
}

// Builds and appends the prompt half of an exchange immediately. Never
// mutated again after insertion.
function addPrompt(userText) {
  exchangeCount += 1;
  const n = exchangeCount;

  const section = document.createElement('section');
  section.className = 'exchange';
  section.setAttribute('aria-label', `Exchange ${n}`);
  section.setAttribute('aria-atomic', 'true');

  const h2 = document.createElement('h2');
  h2.textContent = `PROMPT ${n}.`;
  section.appendChild(h2);

  const promptP = document.createElement('p');
  promptP.className = 'prompt-text';
  promptP.textContent = userText;
  section.appendChild(promptP);

  const promptActions = document.createElement('div');
  promptActions.className = 'actions';
  promptActions.appendChild(makeCopyButton(() => userText, `Copy prompt ${n}`));
  promptActions.appendChild(makePlaceholderButton('Edit', `edit-prompt-${n}`));
  section.appendChild(promptActions);

  chatEl.appendChild(section);
  chatEl.scrollTop = chatEl.scrollHeight;

  return { section, n };
}

// Builds the response nodes (heading, body, actions) for one exchange.
// isLatest controls whether a Retry button is included -- only the
// current latest exchange should ever have one.
function buildResponseNodes(n, assistantText, isLatest) {
  const h3 = document.createElement('h3');
  h3.className = 'response-heading';
  h3.textContent = `RESPONSE ${n}.`;

  const responseBody = document.createElement('div');
  responseBody.className = 'response-body';
  responseBody.innerHTML = renderMarkdown(assistantText);

  const responseActions = document.createElement('div');
  responseActions.className = 'actions response-actions';
  responseActions.appendChild(makeCopyButton(() => assistantText, `Copy response ${n}`));
  responseActions.appendChild(makePlaceholderButton('Good response', `good-response-${n}`));
  responseActions.appendChild(makePlaceholderButton('Bad response', `bad-response-${n}`));

  if (isLatest) {
    const retryBtn = document.createElement('button');
    retryBtn.type = 'button';
    retryBtn.className = 'retry-btn';
    retryBtn.textContent = 'Retry';
    retryBtn.setAttribute('aria-label', `Retry response ${n}`);
    retryBtn.addEventListener('click', retryLatestResponse);
    responseActions.appendChild(retryBtn);
  }

  return { h3, responseBody, responseActions };
}

// (Re)renders the response half of a section. On first render this just
// appends; on retry it first removes the previous response nodes from
// this same section, then appends fresh ones -- an intentional, in-place
// replacement of already-inserted content, which is exactly what
// aria-atomic on the section is for: announcing genuinely new content
// that has replaced old content, in response to an explicit user action.
function renderResponse(section, n, assistantText, isLatest) {
  section.querySelectorAll('.response-heading, .response-body, .response-actions')
    .forEach((el) => el.remove());

  const { h3, responseBody, responseActions } = buildResponseNodes(n, assistantText, isLatest);
  const fragment = document.createDocumentFragment();
  fragment.appendChild(h3);
  fragment.appendChild(responseBody);
  fragment.appendChild(responseActions);
  section.appendChild(fragment);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function saveConversation() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ apiHistory: history, exchanges: exchanges }));
  } catch (e) {
    // localStorage unavailable or full -- chat still works this session.
  }
}

function restoreConversation() {
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  } catch (e) {
    saved = null;
  }
  if (!saved || !Array.isArray(saved.exchanges) || saved.exchanges.length === 0) return;

  chatEl.removeAttribute('aria-live');
  chatEl.removeAttribute('role');

  history = saved.apiHistory || [];
  const lastIndex = saved.exchanges.length - 1;
  saved.exchanges.forEach((ex, i) => {
    const { section, n } = addPrompt(ex.prompt);
    const isLatest = i === lastIndex;
    renderResponse(section, n, ex.response, isLatest);
    if (isLatest) {
      latestSection = section;
      latestN = n;
    }
  });
  exchanges = saved.exchanges;

  requestAnimationFrame(() => {
    chatEl.setAttribute('role', 'log');
    chatEl.setAttribute('aria-live', 'polite');
  });
}

function newConversation() {
  if (!confirm('Start a new conversation? This clears the current chat.')) return;
  chatEl.innerHTML = '';
  history = [];
  exchanges = [];
  exchangeCount = 0;
  latestSection = null;
  latestN = 0;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  statusEl.textContent = '';
  inputEl.focus();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  setBusy(true);
  statusEl.textContent = 'Thinking...';

  // Demote the previous latest response's Retry button -- only the
  // newest exchange should ever offer it.
  if (latestSection) {
    const oldRetry = latestSection.querySelector('.retry-btn');
    if (oldRetry) oldRetry.remove();
  }

  const { section, n } = addPrompt(text);
  const historyLengthBefore = history.length;
  let assistantText;

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history })
    });
    const data = await resp.json();
    if (data.error) {
      assistantText = `Error: ${data.error}`;
    } else {
      assistantText = data.reply;
      history = data.history;
    }
  } catch (e) {
    assistantText = `Error contacting server: ${e}`;
  }

  renderResponse(section, n, assistantText, true);
  exchanges.push({ prompt: text, response: assistantText, historyLengthBefore });
  latestSection = section;
  latestN = n;
  saveConversation();

  statusEl.textContent = '';
  setBusy(false);
  inputEl.focus();
}

// Retries only ever the latest exchange. The server's returned "history"
// is always the prior history plus this turn's new messages appended
// (never rewritten) -- possibly several messages if tools were called,
// not just one prompt/reply pair. So rather than guess how many messages
// to strip off, we replay the exact prefix length recorded before this
// exchange was first sent, sliced from the current cumulative history.
async function retryLatestResponse() {
  if (!latestSection || exchanges.length === 0) return;
  const idx = exchanges.length - 1;
  const entry = exchanges[idx];

  setBusy(true);
  statusEl.textContent = 'Retrying...';

  const historyForRetry = history.slice(0, entry.historyLengthBefore);
  let assistantText;

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: entry.prompt, history: historyForRetry })
    });
    const data = await resp.json();
    if (data.error) {
      assistantText = `Error: ${data.error}`;
    } else {
      assistantText = data.reply;
      history = data.history; // replaces the tail from historyLengthBefore on
    }
  } catch (e) {
    assistantText = `Error contacting server: ${e}`;
  }

  renderResponse(latestSection, latestN, assistantText, true);
  exchanges[idx] = { prompt: entry.prompt, response: assistantText, historyLengthBefore: entry.historyLengthBefore };
  saveConversation();

  statusEl.textContent = '';
  setBusy(false);
}

composerEl.addEventListener('submit', (e) => {
  e.preventDefault();
  sendMessage();
});
newConversationBtn.addEventListener('click', newConversation);

restoreConversation();
</script>
</body>
</html>
