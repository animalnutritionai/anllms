name: Replace repo with uploaded ZIP

on:
  push:
    paths:
      - "uploads/**"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: find_zip
        run: |
          ZIP=$(find uploads -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found in uploads folder"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Remove existing project files
        run: |
          find . -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "uploads" \
            -exec rm -rf {} +

      - name: Extract ZIP
        run: |
          unzip -o "${{ steps.find_zip.outputs.ZIP }}" -d .

      - name: Remove ZIP file
        run: |
          rm -f uploads/*.zip

      - name: Commit replacement
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Replace project from uploaded ZIP" || echo "No changes to commit"
          git push