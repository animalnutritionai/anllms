name: Replace repo with uploaded ZIP

on:
  push:
    paths:
      - "uploads/*.zip"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove existing project files
        run: |
          find . -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "uploads" \
            -exec rm -rf {} +

      - name: Extract ZIP
        run: |
          unzip -o uploads/*.zip -d .

      - name: Remove ZIP file
        run: |
          rm uploads/*.zip

      - name: Commit replacement
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Replace project from uploaded ZIP" || echo "No changes"
          git push
